name: pull-request
run-name: Pull Request Checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, Test and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
        working-directory: app
      - name: Test
        run: npm test
        working-directory: app
      - name: Build
        run: npm run build
        working-directory: app
